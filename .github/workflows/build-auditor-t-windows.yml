name: Compilar Auditor de Carpetas T para Windows

on:
  push:
    paths:
      - auditor_carpetas_t.py
      - .github/workflows/build-auditor-t-windows.yml
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip ; python -m pip install pyinstaller

      - name: Crear ejecutable portable
        run: pyinstaller --noconfirm --clean --windowed --onedir --name "Auditor de Carpetas T" auditor_carpetas_t.py

      - name: Empaquetar aplicación
        shell: pwsh
        run: Compress-Archive -Path "dist/Auditor de Carpetas T" -DestinationPath "Auditor_Carpetas_T_Windows.zip"

      - name: Publicar descarga
        uses: actions/upload-artifact@v4
        with:
          name: Auditor_Carpetas_T_Windows
          path: Auditor_Carpetas_T_Windows.zip
          if-no-files-found: error
          retention-days: 30
